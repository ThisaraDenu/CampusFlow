spring.application.name=campusflow-backend

# Server configuration
server.port=${SERVER_PORT:10000}
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.min-response-size=1024

# MongoDB (use environment variable)
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# JWT (must be set via environment variable)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Frontend URL and CORS
app.frontend.url=${FRONTEND_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Admin bootstrap (only use in development)
app.bootstrap-admin.email=${ADMIN_EMAIL}
app.bootstrap-admin.password=${ADMIN_PASSWORD}
app.bootstrap-admin.name=${ADMIN_NAME}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Google OAuth2 (use environment variables)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Cloudinary (use environment variables)
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Booking auto-approval rules
app.booking.auto-approve.enabled=true
app.booking.auto-approve.max-duration-minutes=180
app.booking.auto-approve.enforce-capacity=true
app.booking.auto-approve.require-within-availability=true

# Ticket SLA scheduler
app.ticket-sla.check-interval-ms=300000

# Logging
logging.level.root=INFO
logging.level.backend=INFO
